abstract_en: |
  Campus API services running on a single server create a single point of failure and degrade under rising request loads. This research aims to design and build a distributed system with Round Robin load balancing to distribute API requests across multiple server nodes. The architecture applies service replication, periodic health checking, and automatic failover when a node becomes unhealthy. Performance evaluation measures throughput, average response time, and service availability under increasing load scenarios. Functional verification combines black box testing with node-failure scenario testing. Expected outcomes comprise a more reliable and scalable distributed system architecture with documented performance evaluation results.

