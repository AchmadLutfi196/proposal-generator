abstract_id: |
  Layanan API kampus yang dijalankan pada satu server tunggal menjadi titik kegagalan tunggal dan mudah kewalahan saat beban permintaan meningkat. Penelitian ini bertujuan merancang dan membangun sistem terdistribusi dengan penyeimbang beban Round Robin untuk mendistribusikan permintaan API ke beberapa node server. Arsitektur sistem menerapkan replikasi layanan, health check berkala, dan mekanisme failover otomatis saat satu node tidak sehat. Evaluasi performa dilakukan dengan mengukur throughput, waktu respons rata-rata, dan ketersediaan layanan pada skenario beban bertingkat. Pengujian fungsionalitas dilakukan melalui black box testing dan pengujian skenario kegagalan node. Luaran penelitian berupa arsitektur sistem terdistribusi yang lebih andal dan skalabel beserta dokumentasi hasil evaluasi performa.

