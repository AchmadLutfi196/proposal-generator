abstract_en: |
  Manual essay grading frequently suffers from evaluator subjectivity, inter-rater variability, and time constraints when handling substantial volumes of student submissions. This research aims to develop an automated essay scoring system leveraging the IndoBERT language model within a multi-rater architecture to deliver objective and transparent score recommendations. The semantic representation pipeline utilizes the pretrained indobenchmark/indobert-base-p2 model paired with mean pooling and cosine similarity between student responses and reference answer keys. The platform incorporates multi-teacher scoring records to uphold assessment accountability. Experimental evaluation is conducted using Quadratic Weighted Kappa, Root Mean Square Error, and Mean Absolute Error against verified teacher benchmark scores. Functional compliance is evaluated via black box testing across assignment configuration, scoring, and mark aggregation modules. Expected outcomes comprise an educational assessment software platform alongside comprehensive performance benchmarks.

keywords_en:
  - Automated Essay Scoring
  - IndoBERT
  - Multi-Rater
  - Cosine Similarity
