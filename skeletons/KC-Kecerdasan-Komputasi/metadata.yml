abstract_id: |
  Klasifikasi penyakit daun kopi secara manual memerlukan keahlian visual yang tinggi dan cenderung lambat pada kebun berskala luas. Penelitian ini bertujuan mengembangkan model Convolutional Neural Network untuk mengklasifikasikan citra daun kopi menjadi sehat dan terserang karat daun. Model menggunakan transfer learning dari arsitektur MobileNetV2 yang dilatih pada dataset citra daun kopi berlabel. Evaluasi performa dilakukan menggunakan confusion matrix, akurasi, presisi, recall, dan F1-score. Pengujian fungsionalitas sistem dilakukan melalui black box testing. Luaran penelitian berupa model klasifikasi citra penyakit tanaman beserta dokumentasi performa model.

keywords_id:
