abstract_en: |
  Manual identification of coffee leaf disease requires specialized visual expertise and is slow on large plantations. This research aims to develop a Convolutional Neural Network model to classify coffee leaf images as healthy or leaf rust infected. The model applies transfer learning from the MobileNetV2 architecture trained on a labeled coffee leaf image dataset. Model performance is evaluated using a confusion matrix, accuracy, precision, recall, and F1-score. System functionality is verified through black box testing. Expected outcomes comprise a plant disease image classification model with documented performance benchmarks.

keywords_en:
  - Image Classification
  - Convolutional Neural Network
  - MobileNetV2
  - Plant Disease Detection
