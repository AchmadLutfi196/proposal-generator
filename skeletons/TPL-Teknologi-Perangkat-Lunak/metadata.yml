abstract_en: |
  Laboratory equipment lending in the study program is still managed manually, causing data loss, booking conflicts, and poor traceability of equipment status. This research aims to design and build a web-based laboratory equipment lending information system using the Waterfall development model. System modeling applies Unified Modeling Language diagrams including use case, activity, and class diagrams. Functional requirements cover inventory management, lending, returns, and usage reporting. Functionality verification is conducted through black box testing across all mandatory system modules. Expected outcomes comprise a web-based laboratory equipment lending application with design documentation and a testing report.

