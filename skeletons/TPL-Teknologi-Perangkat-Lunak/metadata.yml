abstract_id: |
  Pengelolaan peminjaman alat laboratorium di program studi masih dilakukan secara manual sehingga rawan kehilangan data, duplikasi jadwal peminjaman, dan sulitnya pelacakan status alat. Penelitian ini bertujuan merancang dan membangun sistem informasi peminjaman alat laboratorium berbasis web dengan model pengembangan Waterfall. Pemodelan sistem menggunakan diagram Unified Modeling Language meliputi use case, activity, dan class diagram. Kebutuhan fungsional sistem mencakup manajemen inventaris, peminjaman, pengembalian, dan laporan pemakaian. Pengujian fungsionalitas dilakukan menggunakan black box testing pada seluruh modul wajib sistem. Luaran penelitian berupa aplikasi web peminjaman alat laboratorium beserta dokumen perancangan dan laporan pengujian.

